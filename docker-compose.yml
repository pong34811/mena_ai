services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mena_ai
      POSTGRES_USER: mena_ai
      POSTGRES_PASSWORD: mena_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://mena_ai:mena_ai@db:5432/mena_ai
      FREE_LLM_API_URL: http://freellmapi:9001/v1/chat/completions
      REDIS_URL: redis://redis:6379/0
      PIPER_TTS_URL: http://piper:8888
    volumes:
      - ./backend:/app
      - tts_cache:/app/tts_cache
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - piper

  celery-worker:
    build: ./backend
    command: celery -A config.celery worker -l info --concurrency=2
    env_file: ./backend/.env
    environment:
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://mena_ai:mena_ai@db:5432/mena_ai
      FREE_LLM_API_URL: http://freellmapi:9001/v1/chat/completions
      REDIS_URL: redis://redis:6379/0
      PIPER_TTS_URL: http://piper:8888
    volumes:
      - ./backend:/app
      - tts_cache:/app/tts_cache
    depends_on:
      - db
      - redis
      - piper

  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  piper:
    build: ./piper
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    environment:
      PORT: 9001
      HOST_BIND: 0.0.0.0
      NODE_ENV: development
    env_file: ./freellmapi/.env
    command: ["sh", "-c", "cd /app/server && node dist/db/migrate/cli.js up 2>/dev/null || true; cd /app/server && node dist/index.js"]
    volumes:
      - freellmapi_data:/app/server/data
    ports:
      - "9001:9001"

volumes:
  postgres_data:
  redis_data:
  tts_cache:
  freellmapi_data:
